<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>餐饮大侦探 · 创业避坑诊断游戏</title>
<!--
  本Demo仅供玩法验证和学习参考，所有角色、场景、数据均为虚构，不涉及任何商业用途
  游戏名：《餐饮大侦探》 玩法：模拟"创业避坑直播间"的互动诊断游戏
  结构：index.html（页面结构/UI） + levels.js（关卡数据） + game.js（核心逻辑）
-->
<style>
  :root{
    --bg:#1a1a2e;
    --bg2:#16213e;
    --accent:#e94560;
    --green:#16c79a;
    --gold:#f5c518;
    --text:#eaeaf2;
    --muted:#9aa0b8;
    --glass:rgba(255,255,255,0.08);
    --glass-border:rgba(255,255,255,0.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(circle at 50% 0%, #23234a 0%, var(--bg) 60%);
    color:var(--text);
    display:flex;justify-content:center;
  }
  /* 手机容器：模拟375px直播间竖屏 */
  #app{
    width:100%;max-width:420px;min-height:100vh;
    display:flex;flex-direction:column;
    background:var(--bg);
    box-shadow:0 0 40px rgba(0,0,0,0.6);
    position:relative;overflow:hidden;
  }

  /* ---------- 顶部 HUD：直播状态 + 耐心值 ---------- */
  #hud{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;
    background:rgba(22,33,62,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--glass-border);
  }
  .live{
    display:flex;align-items:center;gap:6px;
    background:var(--accent);padding:3px 8px;border-radius:20px;
    font-size:11px;font-weight:700;color:#fff;
  }
  .live .dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .hud-score{font-size:12px;color:var(--muted);}
  .hearts{font-size:15px;letter-spacing:2px;line-height:1;}
  .heart{transition:transform .2s;}
  .heart.lost{filter:grayscale(1);opacity:.4;}

  /* ---------- 通用卡片 / 毛玻璃 ---------- */
  .card{
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:16px;
    backdrop-filter:blur(8px);
    padding:16px;
    margin:12px;
  }
  .btn{
    display:inline-block;width:100%;
    padding:13px;border:none;border-radius:12px;
    background:linear-gradient(135deg,#e94560,#c23152);
    color:#fff;font-size:15px;font-weight:700;cursor:pointer;
    transition:transform .1s, opacity .2s;
  }
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn.ghost{background:transparent;border:1px solid var(--glass-border);color:var(--text);}
  .btn.green{background:linear-gradient(135deg,#16c79a,#0fa77f);}
  .title{font-size:20px;font-weight:800;text-align:center;margin:6px 0;}
  .subtitle{font-size:12px;color:var(--muted);text-align:center;}

  /* ---------- 内容区 ---------- */
  #stage-wrap{flex:1;overflow-y:auto;padding-bottom:20px;}
  .stage{display:none;}
  .stage.active{display:block;animation:fadeIn .3s;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- 关卡选择页 ---------- */
  .select-head{text-align:center;padding:32px 20px 8px;}
  .select-emoji{font-size:56px;animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .select-title{font-size:22px;font-weight:800;margin-top:6px;}
  .level-list{display:flex;flex-direction:column;gap:12px;margin:16px 12px;}
  .level-card{
    display:flex;align-items:center;gap:14px;padding:16px;
    background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;
    cursor:pointer;transition:transform .1s, border .2s;
  }
  .level-card:active{transform:scale(.98);}
  .level-card.locked{opacity:.6;}
  .level-card .level-emoji{font-size:40px;flex:none;}
  .level-card .level-info{flex:1;}
  .level-card .level-title{font-size:16px;font-weight:800;}
  .level-card .level-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .level-card .level-meta{font-size:11px;color:var(--gold);margin-top:6px;}
  .level-card .level-status{font-size:13px;flex:none;}
  .dev-unlock{text-align:center;margin:8px 0 20px;}
  .dev-unlock button{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;}

  /* ---------- 连麦审问：直播间视频窗 ---------- */
  .video-win{
    position:relative;margin:12px;border-radius:16px;overflow:hidden;
    background:#0f1630;border:1px solid var(--glass-border);
    aspect-ratio:4/3;
  }
  .video-win .bg{
    position:absolute;inset:0;
    background:radial-gradient(circle at 30% 40%, #2c2c55, #14142b);
  }
  .video-win .shopkeeper{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:110px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.5));
    animation:shake .5s infinite;
  }
  /* 店主"拿手机转圈"晃动效果 */
  @keyframes shake{
    0%{transform:translate(0,0) rotate(0)}
    25%{transform:translate(4px,-6px) rotate(-3deg)}
    50%{transform:translate(-4px,3px) rotate(2deg)}
    75%{transform:translate(3px,6px) rotate(-2deg)}
    100%{transform:translate(0,0) rotate(0)}
  }
  .video-win .rec{
    position:absolute;top:10px;left:10px;
    font-size:10px;color:#fff;background:rgba(0,0,0,.5);
    padding:3px 8px;border-radius:6px;
  }
  .video-win .avatar{
    position:absolute;bottom:10px;left:10px;
    width:44px;height:44px;border-radius:50%;
    background:var(--accent);display:flex;align-items:center;justify-content:center;
    font-size:24px;border:2px solid #fff;
  }
  .video-win .cam-hint{
    position:absolute;bottom:14px;right:12px;font-size:11px;color:var(--muted);
  }

  /* ---------- 对话气泡 ---------- */
  .bubble{
    position:relative;background:#242448;border:1px solid var(--glass-border);
    border-radius:12px;padding:12px 14px;margin:0 12px 12px;font-size:14px;line-height:1.6;
  }
  .bubble::after{
    content:"";position:absolute;left:20px;top:-8px;
    border:8px solid transparent;border-bottom-color:#242448;border-top:none;
  }
  .bubble .who{font-size:11px;color:var(--gold);font-weight:700;margin-bottom:4px;}

  /* ---------- 360环视缩略图 ---------- */
  .env-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 12px;}
  .env-item{
    position:relative;background:var(--glass);border:1px solid var(--glass-border);
    border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;
    transition:border .2s, transform .1s;
  }
  .env-item:active{transform:scale(.96);}
  .env-item .icon{font-size:38px;display:block;margin-bottom:6px;}
  .env-item .label{font-size:12px;line-height:1.4;}
  .env-item.saved{border-color:var(--green);}
  .env-item.saved::after{
    content:"✓ 已存";position:absolute;top:6px;right:6px;
    font-size:10px;color:#fff;background:var(--green);border-radius:8px;padding:2px 6px;
  }
  .clue-count{text-align:center;font-size:12px;color:var(--muted);margin:10px 0;}

  /* ---------- 选项按钮 ---------- */
  .opts{display:flex;flex-direction:column;gap:10px;margin:0 12px;}
  .opt{
    text-align:left;padding:13px 14px;border-radius:12px;
    background:var(--glass);border:1px solid var(--glass-border);
    color:var(--text);font-size:14px;cursor:pointer;transition:all .15s;
  }
  .opt:active{transform:scale(.98);}
  .opt.correct{background:rgba(22,199,154,.25);border-color:var(--green);}
  .opt.wrong{background:rgba(233,69,96,.25);border-color:var(--accent);}
  .opt:disabled{cursor:not-allowed;}

  .feedback{
    margin:10px 12px;padding:12px;border-radius:12px;font-size:14px;text-align:center;
    animation:fadeIn .2s;
  }
  .feedback.ok{background:rgba(22,199,154,.2);color:var(--green);}
  .feedback.no{background:rgba(233,69,96,.2);color:#ff8598;}

  /* ---------- 找茬：店铺俯视图（分区与错误点由 game.js 数据驱动） ---------- */
  .shop{
    position:relative;margin:12px;border-radius:16px;overflow:hidden;
    background:#23233f;border:2px solid var(--glass-border);
    aspect-ratio:1/1;
  }
  .shop .zone{
    position:absolute;text-align:center;font-size:11px;color:var(--muted);
    border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;overflow:hidden;line-height:1.3;
  }
  .shop .zone .big{font-size:30px;display:block;line-height:1;margin-bottom:4px;}
  .shop .zone[data-reveal]{border:1px dashed var(--gold);}
  .zone-hint{position:absolute;top:4px;right:6px;font-size:12px;animation:pulse 1.6s infinite;}
  .flaw-mark{
    position:absolute;width:32px;height:32px;border-radius:50%;
    background:var(--accent);color:#fff;font-size:15px;font-weight:900;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;z-index:5;animation:glow 1.4s infinite;
    box-shadow:0 0 0 0 rgba(233,69,96,.5);
    transform:translate(-50%,-50%);
  }
  .flaw-mark.found{background:var(--green);animation:none;}
  @keyframes glow{
    0%{box-shadow:0 0 0 0 rgba(233,69,96,.5)}
    70%{box-shadow:0 0 0 12px rgba(233,69,96,0)}
    100%{box-shadow:0 0 0 0 rgba(233,69,96,0)}
  }

  /* ---------- 数据面板表格 ---------- */
  .panel{width:100%;border-collapse:collapse;font-size:13px;}
  .panel th,.panel td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--glass-border);}
  .panel th{color:var(--muted);font-weight:500;font-size:12px;}
  .panel td.num{font-family:ui-monospace,monospace;}

  /* ---------- 连线阶段 ---------- */
  .link-area{
    position:relative;margin:12px;min-height:420px;
  }
  .link-col{position:absolute;top:0;bottom:0;width:44%;display:flex;flex-direction:column;gap:14px;justify-content:space-around;}
  .link-col.left{left:0;}
  .link-col.right{right:0;}
  .link-card{
    background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;
    padding:12px;font-size:13px;line-height:1.4;cursor:pointer;text-align:center;
    transition:all .15s;min-height:64px;display:flex;align-items:center;justify-content:center;
  }
  .link-card.selected{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);}
  .link-card.locked{border-color:var(--green);opacity:.95;cursor:default;}
  .link-card.done-left{background:rgba(22,199,154,.18);}
  #link-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}

  /* ---------- 急救 ---------- */
  .rescue-list{display:flex;flex-direction:column;gap:12px;margin:0 12px;}
  .rescue-item{
    display:flex;gap:12px;align-items:center;padding:14px;border-radius:12px;
    background:var(--glass);border:1px solid var(--glass-border);cursor:pointer;
    font-size:14px;transition:all .15s;
  }
  .rescue-item .tag{
    flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent);
    color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;
  }
  .rescue-item.ok{background:rgba(22,199,154,.25);border-color:var(--green);}
  .rescue-item.no{background:rgba(233,69,96,.2);border-color:var(--accent);}
  .rescue-item:disabled{cursor:not-allowed;}

  /* ---------- 结算 ---------- */
  .report-head{text-align:center;padding:20px 16px 6px;}
  .report-score{font-size:52px;font-weight:900;color:var(--gold);}
  .report-title{font-size:16px;margin-top:4px;}
  .achieve{
    display:inline-block;margin-top:10px;padding:8px 18px;border-radius:24px;
    background:linear-gradient(135deg,#f5c518,#e09b00);color:#3a2a00;font-weight:800;font-size:16px;
  }
  .report-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px;}
  .stat{background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;padding:14px;text-align:center;}
  .stat .k{font-size:11px;color:var(--muted);}
  .stat .v{font-size:22px;font-weight:800;margin-top:4px;}

  /* ---------- 敲锣动画 ---------- */
  #bell{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    font-size:90px;z-index:100;pointer-events:none;display:none;
  }
  #bell.play{display:block;animation:bellRing .9s ease-out forwards;}
  @keyframes bellRing{
    0%{transform:translate(-50%,-50%) scale(0) rotate(-40deg);opacity:0;}
    25%{transform:translate(-50%,-50%) scale(1.5) rotate(15deg);opacity:1;}
    50%{transform:translate(-50%,-50%) scale(1.1) rotate(-12deg);}
    75%{transform:translate(-50%,-50%) scale(1.3) rotate(8deg);}
    100%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:0;}
  }

  /* ---------- 弹窗 ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:90;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    width:100%;max-width:340px;background:#22223f;border:1px solid var(--glass-border);
    border-radius:18px;padding:20px;animation:pop .2s;
  }
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h3{margin-bottom:10px;font-size:17px;}
  .modal p{font-size:14px;line-height:1.7;color:#cfd3e6;margin-bottom:14px;}
  .modal .btn{margin-top:4px;}

  .section-hint{font-size:12px;color:var(--muted);text-align:center;margin:6px 0;}
  .continue{margin:14px 12px;}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 顶部 HUD ============ -->
  <header id="hud">
    <div class="live"><span class="dot"></span> LIVE</div>
    <div class="hud-score">得分 <span id="hud-score">0</span></div>
    <div class="hearts" id="hearts"></div>
  </header>

  <!-- 敲锣反馈层 -->
  <div id="bell">🔔</div>

  <div id="stage-wrap">

    <!-- ============ 关卡选择页 ============ -->
    <section class="stage active" id="stage-select">
      <div class="select-head">
        <div class="select-emoji">🕵️</div>
        <div class="select-title">餐饮大侦探</div>
        <div class="subtitle">模拟"创业避坑直播间" · 选择你要诊断的店铺</div>
      </div>
      <div class="level-list" id="level-list"></div>
      <div class="dev-unlock"><button onclick="devUnlockAll()">🎮 解锁全部关卡（试玩）</button></div>
      <div class="section-hint">仅供玩法验证 · 数据与角色均为虚构</div>
    </section>

    <!-- ============ 第一阶段：连麦审问 ============ -->
    <section class="stage" id="stage-ask">
      <div id="ask-content"></div>
    </section>

    <!-- ============ 第二阶段：找茬 ============ -->
    <section class="stage" id="stage-find">
      <div id="find-content"></div>
    </section>

    <!-- ============ 第三阶段：连线 ============ -->
    <section class="stage" id="stage-link">
      <div class="title" style="font-size:17px;">🔗 连线 · 错误配对</div>
      <div class="subtitle">先点左边「原因」，再点右边「后果」</div>
      <div class="link-area" id="link-area">
        <canvas id="link-canvas"></canvas>
        <div class="link-col left" id="link-left"></div>
        <div class="link-col right" id="link-right"></div>
      </div>
      <div class="continue">
        <button class="btn" id="link-next" onclick="goToFirstAid()" disabled>进入急救阶段 →</button>
      </div>
    </section>

    <!-- ============ 第四阶段：急救 ============ -->
    <section class="stage" id="stage-rescue">
      <div id="rescue-content"></div>
    </section>

    <!-- ============ 第五阶段：结算 ============ -->
    <section class="stage" id="stage-result">
      <div id="result-content"></div>
    </section>

    <!-- ============ 诊断失败 ============ -->
    <section class="stage" id="stage-fail">
      <div id="fail-content"></div>
    </section>

  </div><!-- /stage-wrap -->
</div><!-- /app -->

<!-- 通用弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<!-- 数据与逻辑分离：levels.js 提供关卡数据，game.js 提供核心逻辑 -->
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
